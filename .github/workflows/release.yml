name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'runnerctl'
      - 'runnerctl-base'
      - 'runnerctl-base-v05'
      - 'runnerctl-base-legacy'
      - 'bin/runnerctl'
      - 'bin/runnerctl-legacy'
      - 'bin/runnerctl-cleanup'
      - 'bin/runnerctl-host'
      - 'bin/runnerctl-ci'
      - 'bin/runnerctl-hooks'
      - 'bin/runnerctl-queue'
      - 'bin/runnerctl-queue-legacy'
      - 'bin/runnerctl-scheduler'
      - 'bin/runnerctl-scheduler-core'
      - 'bin/runnerctl-notify'
      - 'bin/runnerctl-notify-provider-*'
      - 'package.json'
      - 'npm/**'
      - 'scripts/package-release.sh'
      - 'docs/notifications.md'
      - 'docs/releases/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'skills/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release state
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cli_version="$(bash runnerctl version)"
          package_version="$(node -p "require('./package.json').version")"
          package_name="$(node -p "require('./package.json').name")"
          test "$cli_version" = "$package_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then tag="$GITHUB_REF_NAME"; test "${tag#v}" = "$cli_version"; else tag="v$cli_version"; fi
          if gh release view "$tag" >/dev/null 2>&1; then github_release_exists=true; else github_release_exists=false; fi
          if npm view "${package_name}@${cli_version}" version --json >/dev/null 2>&1; then npm_package_exists=true; else npm_package_exists=false; fi
          echo "version=$cli_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "github_release_exists=$github_release_exists" >> "$GITHUB_OUTPUT"
          echo "npm_package_exists=$npm_package_exists" >> "$GITHUB_OUTPUT"

      - name: Release state
        run: |
          echo "version=${{ steps.version.outputs.version }}"
          echo "tag=${{ steps.version.outputs.tag }}"
          echo "package=${{ steps.version.outputs.package_name }}"
          echo "github_release_exists=${{ steps.version.outputs.github_release_exists }}"
          echo "npm_package_exists=${{ steps.version.outputs.npm_package_exists }}"

      - name: Run tests
        if: steps.version.outputs.github_release_exists != 'true' || steps.version.outputs.npm_package_exists != 'true'
        run: |
          bash tests/smoke.sh
          bash tests/installer.sh
          bash tests/scheduler.sh
          bash tests/notify.sh

      - name: Publish npm package
        id: npm_publish
        if: steps.version.outputs.npm_package_exists != 'true' && env.NODE_AUTH_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: npm publish --access public --provenance

      - name: Verify npm publication
        id: npm_verify
        if: steps.version.outputs.npm_package_exists != 'true' && env.NODE_AUTH_TOKEN != '' && steps.npm_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.version.outputs.package_name }}"; version="${{ steps.version.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "${package}@${version}" version --json 2>/dev/null || true)"
            if [[ "$published" == *"$version"* ]]; then echo "Verified npm publication: ${package}@${version}"; exit 0; fi
            sleep 2
          done
          echo "npm registry did not report ${package}@${version} after publication." >&2; exit 1

      - name: Report pending npm publication
        if: steps.version.outputs.npm_package_exists != 'true' && (env.NODE_AUTH_TOKEN == '' || steps.npm_publish.outcome == 'failure' || steps.npm_verify.outcome == 'failure')
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::warning::NPM_TOKEN is not configured. GitHub Release will still be created; npm publication remains pending."
          elif [[ "${{ steps.npm_publish.outcome }}" == "failure" ]]; then
            echo "::warning::npm publish failed for ${{ steps.version.outputs.package_name }}. GitHub Release will still be created. Check NPM_TOKEN package/scope permissions and bypass-2FA."
          else
            echo "::warning::npm registry verification did not complete. GitHub Release will still be created."
          fi

      - name: Build release artifacts
        if: steps.version.outputs.github_release_exists != 'true'
        run: bash scripts/package-release.sh

      - name: Create GitHub Release
        if: steps.version.outputs.github_release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          target_args=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then target_args+=(--target "$GITHUB_SHA"); fi
          notes_args=(--generate-notes)
          notes_file="docs/releases/${tag}.md"
          if [[ -f "$notes_file" ]]; then notes_args=(--notes-file "$notes_file"); fi
          gh release create "$tag" \
            dist/runnerctl dist/runnerctl.sha256 \
            dist/runnerctl-base dist/runnerctl-base.sha256 \
            dist/runnerctl-base-v05 dist/runnerctl-base-v05.sha256 \
            dist/runnerctl-base-legacy dist/runnerctl-base-legacy.sha256 \
            dist/runnerctl-core dist/runnerctl-core.sha256 \
            dist/runnerctl-core-legacy dist/runnerctl-core-legacy.sha256 \
            dist/runnerctl-cleanup dist/runnerctl-cleanup.sha256 \
            dist/runnerctl-host dist/runnerctl-host.sha256 \
            dist/runnerctl-ci dist/runnerctl-ci.sha256 \
            dist/runnerctl-hooks dist/runnerctl-hooks.sha256 \
            dist/runnerctl-queue dist/runnerctl-queue.sha256 \
            dist/runnerctl-queue-legacy dist/runnerctl-queue-legacy.sha256 \
            dist/runnerctl-scheduler dist/runnerctl-scheduler.sha256 \
            dist/runnerctl-scheduler-core dist/runnerctl-scheduler-core.sha256 \
            dist/runnerctl-notify dist/runnerctl-notify.sha256 \
            dist/runnerctl-notify-provider-telegram dist/runnerctl-notify-provider-telegram.sha256 \
            dist/runnerctl-notify-provider-line dist/runnerctl-notify-provider-line.sha256 \
            dist/runnerctl-notify-provider-webhook dist/runnerctl-notify-provider-webhook.sha256 \
            dist/runnerctl-*.tar.gz dist/runnerctl-*.tar.gz.sha256 \
            --title "runnerctl $tag" "${notes_args[@]}" "${target_args[@]}"

      - name: Nothing to publish
        if: steps.version.outputs.github_release_exists == 'true' && steps.version.outputs.npm_package_exists == 'true'
        run: echo '${{ steps.version.outputs.tag }} is already complete on GitHub Releases and npm.'