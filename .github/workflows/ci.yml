name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n bin/runnerctl
          bash -n install.sh
          bash -n tests/smoke.sh
      - name: Run smoke tests
        run: ./tests/smoke.sh
