name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shell and Python syntax
        run: |
          bash -n runnerctl
          bash -n runnerctl-base
          bash -n runnerctl-base-v06
          bash -n runnerctl-base-v05
          bash -n runnerctl-base-legacy
          bash -n bin/runnerctl
          bash -n bin/runnerctl-legacy
          bash -n bin/runnerctl-cleanup
          bash -n bin/runnerctl-host
          bash -n bin/runnerctl-ci
          bash -n bin/runnerctl-hooks
          bash -n bin/runnerctl-queue
          bash -n bin/runnerctl-queue-legacy
          bash -n bin/runnerctl-scheduler
          bash -n bin/runnerctl-scheduler-core
          bash -n bin/runnerctl-notify
          bash -n bin/runnerctl-notify-provider-telegram
          bash -n bin/runnerctl-notify-provider-line
          bash -n bin/runnerctl-notify-provider-webhook
          bash -n bin/runnerctl-bot
          python3 -m py_compile bin/runnerctl-bot-controller.py tests/test_bot_controller.py
          bash -n install.sh
          bash -n install-legacy.sh
          bash -n scripts/package-release.sh
          bash -n tests/smoke.sh
          bash -n tests/smoke-legacy.sh
          bash -n tests/installer.sh
          bash -n tests/scheduler.sh
          bash -n tests/notify.sh
          bash -n tests/launchd-status.sh
          bash -n tests/cleanup.sh
          bash -n tests/doctor.sh
          bash -n tests/host.sh
          bash -n tests/ci-check.sh
          bash -n tests/hooks.sh
          bash -n tests/queue.sh

      - name: Run smoke tests
        run: bash tests/smoke.sh

      - name: Run v0.7 installer regression tests
        run: bash tests/installer.sh

      - name: Run GitHub-native scheduler regression tests
        run: bash tests/scheduler.sh

      - name: Run notification integration regression tests
        run: bash tests/notify.sh

      - name: Run read-only bot/API controller regression tests
        run: python3 tests/test_bot_controller.py

      - name: Run cleanup regression tests
        run: bash tests/cleanup.sh

      - name: Run doctor regression tests
        run: bash tests/doctor.sh

      - name: Run host bootstrap regression tests
        run: bash tests/host.sh

      - name: Run CI compatibility regression tests
        run: bash tests/ci-check.sh

      - name: Run hook composition regression tests
        run: bash tests/hooks.sh

      - name: Run legacy admission-gate regression tests
        run: bash tests/queue.sh

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Validate Homebrew formula syntax
        if: runner.os == 'macOS'
        run: ruby -c Formula/runnerctl.rb
