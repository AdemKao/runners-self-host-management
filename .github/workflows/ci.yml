name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  issue-6-patch:
    if: github.ref == 'refs/heads/fix/issue-6-launchd-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-6-launchd-status
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded patch
        run: python3 .github/apply-issue-6-fix.py

      - name: Validate patched source
        run: |
          bash -n runnerctl
          bash -n bin/runnerctl
          bash -n tests/smoke.sh
          bash -n tests/launchd-status.sh
          bash tests/smoke.sh
          npm pack --dry-run >/dev/null
          ruby -c Formula/runnerctl.rb

      - name: Commit tested fix and restore CI
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-issue-6-fix.yml .github/apply-issue-6-fix.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runnerctl bin/runnerctl package.json Formula/runnerctl.rb tests/smoke.sh tests/launchd-status.sh .github/workflows/ci.yml .github/workflows/apply-issue-6-fix.yml .github/apply-issue-6-fix.py
          git diff --cached --check
          git commit -m "fix: detect macOS launchd runner status correctly"
          git push origin HEAD:fix/issue-6-launchd-status
